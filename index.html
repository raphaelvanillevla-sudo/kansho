<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanshō</title>
<meta name="theme-color" content="#0e1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanshō">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1115;--bg2:#14181e;--card:#1b2129;--line:#262e38;--line2:#35404c;--text:#e9ecf0;--muted:#8d98a5;--dim:#56616d;--amber:#ffb340;--mint:#3ddc97;--rose:#ff5a78;--sky:#5cb2ff;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block}
code{background:var(--card);padding:1px 6px;border-radius:4px;font-size:13px}
.muted{color:var(--muted)}
.ic{display:inline-flex;width:18px;height:18px;vertical-align:middle;flex:none}
.ic svg,.qa svg,.badges svg,.hl svg{width:100%;height:100%}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(14,17,21,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1260px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:14px 28px}
#nav a.spotlink{color:var(--amber)}
#nav a.spotlink:hover{color:#ffd08a}
.brand{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--amber)}
#nav{display:flex;gap:14px;flex-wrap:wrap}
#nav a{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 0;border-bottom:2px solid transparent}
#nav a:hover{color:var(--text)}
#nav a.on{color:var(--text);border-color:var(--amber)}
.search{margin-left:auto;position:relative}
.search input{width:190px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 34px;color:var(--text);outline:none;transition:width .2s,border-color .2s;font:inherit;font-size:14px}
.search input:focus{width:260px;border-color:var(--line2)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.iconbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:inline-flex}
.iconbtn:hover{color:var(--text);background:var(--card)}
main{max-width:1200px;margin:0 auto;padding:32px 28px 96px}
#view{position:relative}

/* type + sections */
h1.pt{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:-.015em;margin:0 0 6px;line-height:1.15}
.lede{color:var(--muted);margin:0 0 30px}
.lede b{color:var(--text)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:30px;flex-wrap:wrap}
.sec{margin:0 0 46px}
.sech{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:6px}
.sech h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sech a{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.sech a:hover{color:var(--text)}
.empty{border:1px dashed var(--line2);border-radius:8px;padding:40px;text-align:center;color:var(--muted)}
.err{grid-column:1/-1;border:1px solid rgba(255,90,120,.35);background:rgba(255,90,120,.06);border-radius:6px;padding:14px 16px;color:#f3b9c4;font-size:14px}
.loading{color:var(--muted);padding:40px 0}

/* posters */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px 14px}
.grid.lg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.pc{min-width:0;position:relative}
.poster{position:relative;display:block;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster::after{content:'';position:absolute;inset:0;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:box-shadow .12s}
a.poster:hover::after{box-shadow:inset 0 0 0 3px var(--amber)}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-size:13px;line-height:1.3;color:var(--muted);font-family:var(--serif)}
.badges{position:absolute;right:6px;bottom:6px;display:flex;gap:4px;z-index:1}
.badges i{display:flex;width:22px;height:22px;padding:4px;border-radius:50%;background:rgba(10,12,15,.82)}
.badges i.w{color:var(--mint)}.badges i.wl{color:var(--sky)}
.pm{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:18px}
.stars{color:var(--amber);font-size:13px;letter-spacing:1px;white-space:nowrap}
.hl{color:var(--rose);display:inline-flex;width:12px;height:12px}
.cap{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skel{aspect-ratio:2/3;border-radius:5px;background:linear-gradient(100deg,var(--card) 40%,#222a33 50%,var(--card) 60%);background-size:200% 100%;animation:sh 1.4s linear infinite}
.skl{height:14px;margin:10px 0;border-radius:4px;background:linear-gradient(100deg,var(--card) 40%,#222a33 50%,var(--card) 60%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.rm{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border-radius:50%;border:0;background:rgba(10,12,15,.85);color:var(--text);cursor:pointer;padding:6px;display:flex;opacity:0;transition:opacity .12s}
.pc:hover .rm{opacity:1}
.rank{position:absolute;left:6px;top:6px;z-index:2;font-family:var(--serif);font-weight:700;background:rgba(10,12,15,.85);border-radius:4px;padding:0 7px;font-size:14px}

/* anime page */
.bd{position:absolute;left:50%;transform:translateX(-50%);width:100vw;top:-32px;height:540px;overflow:hidden;z-index:0;-webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 55%,transparent);mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 55%,transparent);pointer-events:none}
.bd div{position:absolute;inset:-80px;background-size:cover;background-position:center 30%;filter:blur(44px) saturate(1.3) brightness(.55)}
.film{position:relative;z-index:1;display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:36px;padding-top:28px}
.film .poster{box-shadow:0 22px 55px rgba(0,0,0,.6)}
.film h1{font-family:var(--serif);font-size:42px;line-height:1.08;margin:0;letter-spacing:-.02em}
.film h1 .yr{font-family:var(--sans);font-size:20px;font-weight:500;color:var(--muted);margin-left:10px;letter-spacing:0}
.alt{color:var(--muted);margin:8px 0 2px;font-size:14px}
.facts{color:var(--muted);font-size:13px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 10px}
.facts b{color:#cfd6de;font-weight:600}
.syn{color:#c9d0d8;font-size:15.5px;line-height:1.7;max-width:64ch;white-space:pre-line;margin-top:20px}
.syn.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-top:6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.more:hover{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}
.chip{font-size:12px;padding:3px 10px;border-radius:3px;background:rgba(27,33,41,.9);border:1px solid var(--line);color:#c4ccd5}
a.chip:hover{border-color:var(--line2);color:var(--text)}
.where h4,.mine h4{margin:26px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.where .chips{margin-top:10px}
.malscore{margin-top:14px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;text-transform:uppercase;letter-spacing:.1em}
.malscore b{color:var(--text);font-size:20px;font-family:var(--serif);letter-spacing:0}
.ext{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
.ext:hover{color:var(--text)}
.actions{background:rgba(27,33,41,.9);border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:start;position:sticky;top:84px}
.act3{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.act3 button{background:none;border:0;cursor:pointer;padding:16px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.act3 button .ic{width:30px;height:30px}
.act3 button:hover{color:var(--text)}
.act3 button.on.w{color:var(--mint)}.act3 button.on.l{color:var(--rose)}.act3 button.on.wl{color:var(--sky)}
.rate{padding:14px;text-align:center;border-bottom:1px solid var(--line)}
.rate small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.alink{display:block;width:100%;text-align:center;padding:12px;background:none;border:0;border-bottom:1px solid var(--line);color:#c9d0d8;cursor:pointer;font-size:14px}
.alink:last-child{border-bottom:0}
.alink:hover{background:rgba(255,255,255,.04);color:var(--text)}
.mine .ment{display:block;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mine .ment:hover .mdate{color:var(--text)}
.mine .mtop{display:flex;align-items:center;gap:10px;font-size:13px}
.mine .mdate{color:var(--muted)}
.mine .ment p{margin:6px 0 0;color:#c9d0d8;font-size:14px;white-space:pre-line}
.mine .ic{width:14px;height:14px;color:var(--muted)}
.mine .hl .ic,.mine .hl{color:var(--rose)}

/* star input */
.starin{display:inline-flex;align-items:center;gap:1px;user-select:none;cursor:pointer}
.starin .s{font-size:30px;line-height:1;color:var(--line2)}
.starin .s.f{color:var(--amber)}
.starin .s.h{background:linear-gradient(90deg,var(--amber) 50%,var(--line2) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.starin .clear{width:18px;color:var(--muted);font-size:18px;margin-left:4px;text-align:center}
.starin .clear:hover{color:var(--rose)}

/* search rows */
.srow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25}
.srow h3 a:hover{color:var(--amber)}
.srow h3 span{font-family:var(--sans);color:var(--muted);font-size:14px;font-weight:400;margin-left:8px}
.srow p{margin:3px 0 0;color:var(--muted);font-size:13px}
.qa{display:flex;gap:6px}
.qa button{background:none;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;padding:8px;display:flex;color:var(--dim);cursor:pointer}
.qa button:hover{color:var(--text);border-color:var(--line2)}
.qa button.on.w{color:var(--mint);border-color:rgba(61,220,151,.5)}
.qa button.on.l{color:var(--rose);border-color:rgba(255,90,120,.5)}
.qa button.on.wl{color:var(--sky);border-color:rgba(92,178,255,.5)}

/* diary */
.diary{width:100%;border-collapse:collapse}
.diary td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.diary tr{cursor:pointer}
.diary tr:hover td{background:rgba(255,255,255,.02)}
.diary .mon{width:76px;text-align:center}
.calbox{display:inline-flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:3px 9px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.3;font-weight:700}
.calbox b{font-size:15px;color:var(--text);letter-spacing:0;font-family:var(--serif)}
.diary .day{width:48px;font-family:var(--serif);font-size:24px;color:var(--muted);text-align:center}
.diary .th{width:46px}
.thumb{width:36px;aspect-ratio:2/3;border-radius:3px;object-fit:cover;background:var(--card)}
.diary .tt a{font-weight:600}
.diary .tt a:hover{color:var(--amber)}
.diary .tt span{color:var(--muted);margin-left:8px;font-size:13px}
.diary .rt{width:110px}
.diary .ico{width:30px;color:var(--dim);text-align:center}
.diary .ico .ic{width:15px;height:15px}
.diary .ico.on{color:var(--rose)}
.diary tr:hover .ed{color:var(--text)}
.yrs{display:flex;gap:6px;flex-wrap:wrap}
.yrs a{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.yrs a.on,.yrs a:hover{color:var(--text);border-color:var(--line2);background:var(--card)}

/* lists */
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px 24px}
.lcard .stack{display:flex;height:150px;margin-bottom:12px}
.lcard .stack span{width:100px;height:150px;flex:none;border-radius:4px;background:var(--card) center/cover;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),6px 0 14px rgba(0,0,0,.6);margin-right:-48px}
.lcard h3{margin:0;font-family:var(--serif);font-size:20px}
.lcard:hover h3{color:var(--amber)}
.lcard p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ldesc{color:#c9d0d8;max-width:70ch;margin:-18px 0 26px;white-space:pre-line}

/* buttons + forms */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);color:var(--text);padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#232b35}
.btn .ic{width:15px;height:15px}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1d1404}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--rose)}
.sel{background:var(--card);border:1px solid var(--line2);color:var(--text);border-radius:5px;padding:7px 10px;font:inherit;font-size:13px}
input[type=text],input[type=date],textarea,select.f{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:9px 11px;font:inherit;outline:none;margin-top:6px}
textarea{min-height:140px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--line2)}
label.fld{display:block;font-size:12px;color:var(--muted);margin-bottom:14px;letter-spacing:.02em}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:#c9d0d8;cursor:pointer}
.check input{accent-color:var(--amber);width:16px;height:16px}

/* modal */
.mback{position:fixed;inset:0;background:rgba(5,7,9,.72);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 20px;overflow:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;width:min(660px,100%);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.sm{width:min(460px,100%)}
.modal>header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line)}
.modal>header h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mbody{padding:20px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.logm{display:grid;grid-template-columns:120px 1fr;gap:22px}
.ltitle{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.15;margin-bottom:16px}
.ltitle span{font-family:var(--sans);font-size:15px;color:var(--muted);font-weight:400;margin-left:6px}
.lrow{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.lrow label.fld{margin:0}
.lrow2{display:flex;gap:30px;margin-top:16px;align-items:flex-end}
.lrow2 small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.likebtn{background:none;border:0;cursor:pointer;color:var(--line2);width:34px;height:34px;padding:2px}
.likebtn svg{width:100%;height:100%}
.likebtn.on{color:var(--rose)}
.prow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;cursor:pointer;text-align:left}
.prow:hover{background:rgba(255,255,255,.03)}
.prow em{color:var(--muted);font-style:normal;margin-left:6px;font-size:13px}
.pres{max-height:52vh;overflow:auto;margin-top:12px}
.lrowc{padding:10px 0;border-bottom:1px solid var(--line)}
.lrowc .muted{margin-left:auto;font-size:13px}
.newl{display:flex;gap:10px;margin-top:16px;align-items:center}
.newl input{margin:0}
.setg{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.setg h4{margin:0 0 4px;font-size:14px}
.setg p{margin:0 0 12px;font-size:13px;line-height:1.5}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* profile */
.prof{display:flex;align-items:center;gap:20px;margin-bottom:30px}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--rose));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:36px;font-weight:700;color:#1d1404;flex:none}
.prof h1{margin:0}
.prof p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:46px}
.stat{background:var(--bg2);padding:16px 18px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.15}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.hist{display:flex;align-items:flex-end;gap:4px;height:110px}
.hist div{flex:1;background:var(--line2);border-radius:2px 2px 0 0;min-height:2px}
.hist div:hover{background:var(--amber)}
.histlab{display:flex;justify-content:space-between;color:var(--amber);font-size:12px;margin-top:6px}
.histlab.m{color:var(--muted);letter-spacing:0}
.histlab.m span{flex:1;text-align:center}
.bars .br{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.bars .br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9d0d8}
.bars .br b{text-align:right;color:var(--muted);font-weight:500}
.bars .bt{height:8px;background:var(--card);border-radius:4px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--mint);border-radius:4px}
.bars.st .bt i{background:var(--sky)}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:620px}
.favslot{aspect-ratio:2/3;border:1px dashed var(--line2);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;background:none}
.favslot:hover{color:var(--text);border-color:var(--muted)}
.favslot .ic{width:26px;height:26px}
.rev{display:grid;grid-template-columns:70px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
.rev h3{margin:0;font-family:var(--serif);font-size:19px}
.rev h3 span{font-family:var(--sans);color:var(--muted);font-weight:400;font-size:14px;margin-left:6px}
.rmeta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:3px 0 8px}
.rev p{margin:0;color:#c9d0d8;white-space:pre-line;max-width:72ch}
.spoil{filter:blur(6px);cursor:pointer;user-select:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--card);border:1px solid var(--line2);padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--rose)}

/* discover carousels */
.dkeys{color:var(--muted);font-size:13px;margin:-18px 0 30px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.dkeys kbd{font:600 11px var(--sans);background:var(--card);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--text);margin-right:4px}
.dcount{font-size:13px;color:var(--muted)}
.dcount b{color:var(--mint)}
.crow{margin:0 0 30px}
.crow .sech{align-items:center}
.crow .sech small{font-size:12px;color:var(--dim);margin-left:10px;letter-spacing:0;text-transform:none;font-weight:500}
.carr{display:flex;gap:6px}
.cbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.cbtn:hover{color:var(--text);border-color:var(--muted)}
.ctrack{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;user-select:none;cursor:grab}
.ctrack.dragging{scroll-snap-type:none;cursor:grabbing}
.ctrack.dragging .dtile{pointer-events:none}
.ctrack::-webkit-scrollbar{height:8px}
.ctrack::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.ctrack .err{flex:1}
.dtile{flex:0 0 150px;scroll-snap-align:start;min-width:0}
.dtile .dp{position:relative}
.dtile img{-webkit-user-drag:none}
.dtile .poster::before{content:'';position:absolute;inset:0;z-index:1;background:rgba(14,17,21,.5);opacity:0;transition:opacity .15s;pointer-events:none}
.dtile.watched .poster::before{opacity:1}
.dtile.watched:hover .poster::before{opacity:0}
.dm .hl[hidden]{display:none}
.dskel{flex:0 0 150px}
.drank{position:absolute;left:0;top:0;z-index:2;background:rgba(10,12,15,.86);font-family:var(--serif);font-weight:700;font-size:14px;padding:1px 8px 2px;border-bottom-right-radius:6px}
.dseen{position:absolute;right:6px;top:6px;z-index:2;width:24px;height:24px;padding:4px;border-radius:50%;background:var(--mint);color:#06281a;display:none}
.dseen svg{width:100%;height:100%}
.dtile.watched .dseen{display:flex}
.dq{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:30px 6px 8px;background:linear-gradient(transparent,rgba(8,10,13,.94) 38%);border-radius:0 0 5px 5px;opacity:0;transform:translateY(6px);transition:opacity .12s,transform .12s;pointer-events:none;cursor:default}
.dtile:hover .dq{opacity:1;transform:none;pointer-events:auto}
.dqb{display:flex;margin-bottom:5px}
.dqb button{flex:1;background:none;border:0;color:#a7b1bc;cursor:pointer;height:28px;padding:3px;display:flex;justify-content:center}
.dqb svg{width:21px;height:21px}
.dqb button:hover{color:#fff}
.dqb button.on.w{color:var(--mint)}.dqb button.on.l{color:var(--rose)}.dqb button.on.wl{color:var(--sky)}
.qstars{display:flex;justify-content:center;cursor:pointer}
.qstars span{font-size:22px;line-height:1;color:#4c5764;padding:0 1px}
.qstars span.f{color:var(--amber)}
.qstars span.h{background:linear-gradient(90deg,var(--amber) 50%,#4c5764 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.dcap{margin-top:7px;font-size:12.5px;line-height:1.3}
.dt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfd6de}
.dm{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:2px;min-height:16px}
.dm .stars{font-size:12px}
#view.hidew .dtile.watched{display:none}

/* spotlight (fullscreen poster browser) */
.spot{position:fixed;inset:0;z-index:70;background:#07090c;color:var(--text);overflow:hidden;animation:fade .18s}
.spot .sbg{position:absolute;inset:-90px;background-size:cover;background-position:center 30%;filter:blur(60px) saturate(1.35) brightness(.42);transform:scale(1.05);transition:background-image .25s}
.spot .sbg2{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,transparent 0,rgba(7,9,12,.55) 60%,rgba(7,9,12,.9) 100%)}
.sbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 22px;background:linear-gradient(rgba(7,9,12,.85),transparent);flex-wrap:wrap}
.sbar .brand{font-size:20px;margin-right:8px}
.sbar .sel{background:rgba(27,33,41,.85)}
.sbar .check{font-size:13px}
.sbar .sp{flex:1}
.sbar .cnt{color:var(--muted);font-size:13px;margin-right:6px}
.sbar .iconbtn{color:#c9d0d8}
.sbar .iconbtn .ic{width:20px;height:20px}
.sstage{position:absolute;inset:64px 0 0;z-index:2;display:grid;grid-template-columns:72px minmax(0,auto) minmax(320px,560px) 72px;justify-content:center;align-items:center;gap:0 44px;padding:10px 24px 30px}
.snav{width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(20,24,30,.6);color:#d9dee4;font-size:32px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:4px;justify-self:center}
.snav:hover{background:rgba(40,48,58,.85);color:#fff}
.snav:disabled{opacity:.25;cursor:default}
.sposter{position:relative;height:min(calc(100vh - 140px),calc((100vw - 900px) * 1.5),980px);min-height:300px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 40px 100px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);cursor:zoom-in}
.sposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sposter .ph{font-size:22px}
.sposter.anim0{animation:none}
.sposter.anim{animation:spin .28s cubic-bezier(.2,.8,.3,1)}
.sposter.animb{animation:spinb .28s cubic-bezier(.2,.8,.3,1)}
@keyframes spin{from{opacity:0;transform:translateX(40px) scale(.98)}}
@keyframes spinb{from{opacity:0;transform:translateX(-40px) scale(.98)}}
.sposter .sbadge{position:absolute;top:14px;left:14px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--mint);color:#06281a;display:none}
.sposter .sbadge.wl{background:var(--sky);color:#04203a}
.sposter .sbadge.show{display:block}
.sposter .flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;font-weight:700;background:rgba(7,9,12,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.sposter .flash.on{opacity:1}
.sinfo{min-width:0;max-height:calc(100vh - 120px);overflow:auto;padding-right:6px}
.sinfo .srank{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
.sinfo h2{font-family:var(--serif);font-size:clamp(30px,3.4vw,48px);line-height:1.05;margin:8px 0 6px;letter-spacing:-.02em}
.sinfo .alt{margin:0 0 10px}
.sinfo .facts{margin:0 0 4px}
.snums{display:flex;gap:26px;margin:18px 0 4px}
.snums div b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.snums div span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.sinfo .syn{font-size:15px;margin-top:14px;-webkit-line-clamp:6}
.sacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.sbtn{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(27,33,41,.82);color:var(--text);cursor:pointer;font-weight:600;font-size:15px}
.sbtn:hover{background:rgba(44,53,64,.95)}
.sbtn .ic{width:20px;height:20px}
.sbtn kbd{font:600 11px var(--sans);color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:2px}
.sbtn.on.w{background:var(--mint);border-color:var(--mint);color:#06281a}
.sbtn.on.wl{background:var(--sky);border-color:var(--sky);color:#04203a}
.sbtn.on.l{color:var(--rose);border-color:rgba(255,90,120,.6)}
.sbtn.on kbd{color:inherit;border-color:currentColor;opacity:.6}
.srate{display:flex;align-items:center;gap:14px;margin-top:18px}
.srate small{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.srate .starin .s{font-size:38px}
.shint{margin-top:22px;color:var(--dim);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.shint kbd{font:600 11px var(--sans);color:#aab3bd;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;margin-right:3px}
.sempty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:16px}
.dqb button.fs svg{width:18px;height:18px}
.film .poster.zoom{cursor:zoom-in}

/* profile sub-tabs */
.ptabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:-6px 0 28px}
.ptabs a{padding:10px 0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs a:hover{color:var(--text)}
.ptabs a.on{color:var(--text);border-color:var(--amber)}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.xcard{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:22px}
.xcard h3{margin:0 0 6px;font-family:var(--serif);font-size:22px}
.xcard>p{margin:0 0 16px;color:var(--muted);font-size:14px}
.xrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.xrow div{flex:1;min-width:0}
.xrow b{display:block;font-size:14px}
.xrow span{display:block;font-size:12.5px;color:var(--muted)}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:30px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;display:block}
.drop:hover,.drop.over{border-color:var(--amber);color:var(--text);background:rgba(255,179,64,.04)}
.drop b{color:var(--text);display:block;font-size:16px;margin-bottom:4px}
.ifile{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.ifile b{font-size:14px}
.ifile span{font-size:12.5px;color:var(--muted);grid-column:1}
.ifile select{grid-row:1/3;grid-column:2}
.iprog{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin:14px 0 6px}
.iprog i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
.ires{margin-top:12px;font-size:14px;color:#c9d0d8}
.ires ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px;max-height:180px;overflow:auto}
.cols{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
.cols code{font-size:11.5px}

/* friends: clickable stats + pop-out lists */
.fstats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.stat.clk{border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .12s}
.stat.clk:hover{background:#1c222b}
.stat.clk:hover span{color:var(--amber)}
.modal.wide{width:min(1000px,100%)}
.popbody{max-height:72vh;overflow:auto}
.popgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 12px}
.popgrid .cap{white-space:normal;display:flex;flex-direction:column;gap:2px}
.popgrid .ct{color:#cfd6de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dual{display:flex;align-items:center;gap:6px;font-size:12px}
.dual i{font-style:normal;color:var(--muted);min-width:0;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dual .stars{font-size:12px}
.popg{display:flex;align-items:center;gap:8px;margin:22px 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.popg:first-child{margin-top:0}
.popg span:last-child{color:var(--dim)}
.popsort{display:flex;justify-content:flex-end;gap:10px;margin:-4px 0 14px}
.popsort #popSpot{margin-right:auto}

/* friends */
.fav-av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:18px;color:#14100a;flex:none}
.fav-av.lg{width:84px;height:84px;font-size:36px}
.fav-av.sm{width:26px;height:26px;font-size:12px}
.fshare{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-bottom:44px}
.fcard{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.fcard h3{margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fcard p{margin:0 0 14px;color:var(--muted);font-size:14px}
.fcode{display:flex;align-items:center;gap:12px;margin:6px 0 12px;flex-wrap:wrap}
.fcode code{font-size:20px;letter-spacing:.06em;padding:8px 14px;background:var(--card);border:1px solid var(--line2);border-radius:6px;color:var(--amber);user-select:all}
.fadd{display:flex;gap:10px}
.fadd input{margin:0}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fpc{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.fpc:hover{border-color:var(--line2)}
.fpc b{display:block;font-size:15px}
.fpc span{display:block;font-size:12.5px;color:var(--muted)}
.fpc .err2{color:#f3b9c4}
.feed .fe{display:grid;grid-template-columns:26px 44px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.feed .fe .thumb{width:44px}
.feed .fe p{margin:2px 0 0;font-size:14px;color:#c9d0d8}
.feed .fe .who{font-size:14px}
.feed .fe .who a{font-weight:600}
.feed .fe .who a:hover{color:var(--amber)}
.feed .fe .when{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.feed .fe .rv{margin-top:6px;font-size:14px;color:#c9d0d8;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.fstrip{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fstrip .thumb{width:40px}
.fstrip .more{align-self:center;font-size:12px;color:var(--muted);padding:0 6px}
.match{display:inline-flex;align-items:baseline;gap:6px;margin-left:auto;text-align:right}
.fmine{margin-top:10px}
.fmine .fr{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.fmine .fr a:hover{color:var(--amber)}

@media (max-width:1180px){ .sstage{grid-template-columns:56px minmax(0,auto) minmax(280px,480px) 56px;gap:0 26px} .sposter{height:min(calc(100vh - 140px),calc((100vw - 760px) * 1.5))} }
@media (max-width:980px){
 .film{grid-template-columns:170px minmax(0,1fr)}
 .actions{grid-column:1/-1;position:static}
 .row{grid-template-columns:repeat(4,1fr)}
 .two{grid-template-columns:1fr}
 .xgrid,.fshare{grid-template-columns:1fr}
 .sstage{grid-template-columns:44px minmax(0,1fr) 44px;grid-auto-rows:auto;overflow:auto;align-items:start}
 .sstage .sinfo{grid-column:1/-1;max-height:none}
 .sposter{height:min(62vh,600px);justify-self:center}
 .top .in{flex-wrap:wrap;gap:12px 24px}
 .search input,.search input:focus{width:200px}
}
/* sync, pairing */
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--mint);flex:none;box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.syncdot.busy{background:var(--amber);animation:pulse 1s ease-in-out infinite}
.syncdot.err{background:var(--rose);box-shadow:0 0 0 3px rgba(255,90,120,.15)}
@keyframes pulse{50%{opacity:.35}}
.syncstate{margin:0 0 6px;font-weight:600;color:var(--mint)}
.syncstate.bad{color:#f3b9c4}
.qrbox{display:grid;grid-template-columns:190px 1fr;gap:20px;margin-top:20px;align-items:start}
.qr{background:#fff;border-radius:10px;padding:6px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#333;font-size:12px}
.qr svg{width:100%;height:100%;display:block}
.steps{margin:0;padding-left:20px;font-size:14px;color:#c9d0d8;line-height:1.55}
.steps li{margin-bottom:6px}
.steps.big{font-size:16px;line-height:1.6}
.shareic{display:inline-block;border:1px solid var(--line2);border-radius:4px;padding:0 5px;font-size:13px}
.codeline{display:flex;gap:8px;align-items:center}
.codeline code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:11.5px;padding:8px;line-height:1.4;user-select:all}
.scanwrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:60vh;margin:0 auto}
.scanwrap video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18%;border:3px solid rgba(255,179,64,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.welcome h2{font-family:var(--serif);font-size:28px;margin:0 0 6px}
.welcome .big{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.welcome .big .btn{justify-content:center;padding:13px;font-size:15px}
.cspot{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
.cspot:hover{color:var(--text);border-color:var(--muted)}
.cspot .ic{width:14px;height:14px}
.mob,#tabbar,#libnav{display:none}

/* watching + priority */
.badges i.wa{color:var(--amber)}
.act4{grid-template-columns:repeat(4,1fr)}
.act4 button .ic{width:26px;height:26px}
.act3 button.on.wa{color:var(--amber)}
.qa button.on.wa{color:var(--amber);border-color:rgba(255,179,64,.5)}
.dqb button.on.wa{color:var(--amber)}
.sbtn.on.wa{background:var(--amber);border-color:var(--amber);color:#1d1404}
.aprog{padding:12px 14px;border-bottom:1px solid var(--line)}
.aprog small{display:block;color:var(--muted);font-size:12px;margin-bottom:8px;text-align:center}
.epc{display:flex;align-items:center;justify-content:center;gap:10px}
.epc b{font-family:var(--serif);font-size:24px;min-width:34px;text-align:center}
.epc span{color:var(--muted);font-size:13px}
.epc button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:19px;cursor:pointer;line-height:1;padding:0 0 2px}
.epc button:hover{border-color:var(--amber);color:var(--amber)}
.pbar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--amber);border-radius:2px}
.cap .pbar{margin:0 0 5px}
.cap .ct,.cap .ce{display:block;overflow:hidden;text-overflow:ellipsis}
.cap .ct{color:#cfd6de}
.cap .dual{margin-top:2px}
.wpost{width:70px}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{border:1px solid var(--line2);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on.p3{background:var(--rose);border-color:var(--rose);color:#2a0710}
.seg button.on.p2{background:var(--amber);border-color:var(--amber);color:#1d1404}
.seg button.on.p1{background:var(--sky);border-color:var(--sky);color:#04203a}
.prio{display:inline-flex;align-items:center;gap:2px;padding:3px 8px 3px 6px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:none;background:rgba(10,12,15,.86);border:1px solid var(--line2);color:var(--muted);vertical-align:middle;white-space:nowrap}
.prio[data-prio]{cursor:pointer}
.prio[data-prio]:hover{border-color:var(--text)}
.prio i{width:3px;border-radius:1px;background:var(--line2);display:inline-block}

<script>
'use strict';
/* ---------- basics ---------- */
const API = 'https://api.jikan.moe/v4';
const V = document.getElementById('view');
const META = new Map();          // anime info seen this session (not persisted)
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = s => s ? `${+s.slice(8,10)} ${MON[+s.slice(5,7)-1]} ${s.slice(0,4)}` : '';
const byDateDesc = (a, b) => (b.date||'').localeCompare(a.date||'') || (b.created||0) - (a.created||0);
const starText = r => r ? '★'.repeat(Math.floor(r/2)) + (r % 2 ? '½' : '') : '';
const cap1 = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const uniq = list => { const seen = new Set(); return list.filter(a => a && !seen.has(a.id) && seen.add(a.id)); };

const S = (p, fill) => `<svg viewBox="0 0 24 24" ${fill ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'}>${p}</svg>`;
const ICON = {
  eye: S('<path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/>'),
  heart: S('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>', 1),
  clock: S('<circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/>'),
  plus: S('<path d="M12 5v14M5 12h14"/>'),
  x: S('<path d="M18 6 6 18M6 6l12 12"/>'),
  search: S('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  gear: S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  rewatch: S('<path d="M3 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.2-9.4L3 10"/>'),
  review: S('<path d="M4 6h16M4 11h16M4 16h10"/>'),
  edit: S('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  trash: S('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
  expand: S('<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>'),
  home: S('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>'),
  compass: S('<circle cx="12" cy="12" r="9.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>'),
  library: S('<rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><path d="m15.5 5.2 3.8-1 3.2 15.5-3.8 1z"/>'),
  users: S('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.7c2 .7 3.2 2.5 3.6 5.3"/>'),
  user: S('<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/>'),
  play: S('<path d="M7 4.5v15l13-7.5z"/>', 1),
  dice: S('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>'),
};
const ic = (n, c = '') => `<span class="ic ${c}">${ICON[n]}</span>`;

let toastT;
function toast(msg, err, ms = 2600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', ms);
}

/* ---------- storage ---------- */
const DEFAULT = () => ({ version: 1, profile: { name: '', bio: '' }, settings: { titles: 'english' },
  anime: {}, status: {}, entries: [], watchlist: [], favorites: [null, null, null, null], lists: [],
  friends: [], share: { enabled: false, code: '' }, sync: {}, gh: {}, watching: [] });
let APP = { native: false, dataDir: '' };   // filled from /api/info when running as the desktop app
const Store = {
  mode: 'local', data: DEFAULT(), timer: null,
  async load() {
    if (location.protocol.startsWith('http')) {
      try {
        const r = await fetch('/api/data', { cache: 'no-store' });
        if (r.ok) { this.mode = 'server'; this.data = Object.assign(DEFAULT(), await r.json()); return; }
      } catch (e) { /* fall through to browser storage */ }
    }
    try { const s = localStorage.getItem('kansho'); if (s) this.data = Object.assign(DEFAULT(), JSON.parse(s)); } catch (e) {}
  },
  save(quiet) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 120); if (!quiet) { schedulePublish(); scheduleSync(); } },
  async flush() {
    clearTimeout(this.timer); this.timer = null;
    const body = JSON.stringify(this.data);
    try { localStorage.setItem('kansho', body); } catch (e) { if (this.mode !== 'server') toast('Couldn’t save on this device: ' + e.message, true, 5000); }
    if (this.mode === 'server') {
      try {
        const r = await fetch('/api/data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        if (!r.ok) throw new Error();
      } catch (e) { toast('Couldn’t save to disk — is Kanshō still running?', true, 5000); }
    }
  },
};
const D = () => Store.data;
function fixData() {
  const d = D(), def = DEFAULT();
  for (const k in def) if (d[k] == null || typeof d[k] !== typeof def[k]) d[k] = def[k];
  if (!Array.isArray(d.entries)) d.entries = [];
  if (!Array.isArray(d.watchlist)) d.watchlist = [];
  if (!Array.isArray(d.lists)) d.lists = [];
  if (!Array.isArray(d.favorites)) d.favorites = [];
  if (!Array.isArray(d.friends)) d.friends = [];
  if (!Array.isArray(d.watching)) d.watching = [];
  if (!d.share || typeof d.share !== 'object') d.share = { enabled: false, code: '' };
  if (!d.sync || typeof d.sync !== 'object') d.sync = {};
  if (!d.gh || typeof d.gh !== 'object') d.gh = {};
  if (d.sync.code && !d.sync.code.startsWith('g1.')) d.sync = { device: d.sync.device };   // codes from the jsonblob days
  if (!d.sync.device) d.sync.device = uid();
  while (d.favorites.length < 4) d.favorites.push(null);
  d.favorites = d.favorites.slice(0, 4);
}

const merge = (o, n) => { const r = { ...(o || {}) }; for (const k in n) { const v = n[k]; if (v != null && v !== '' && !(Array.isArray(v) && !v.length)) r[k] = v; } return r; };
function upsertAnime(a) { if (!a?.id) return; const { members, ...keep } = a; D().anime[a.id] = merge(D().anime[a.id], keep); }
function ensure(a) { if (a) { upsertAnime(a); Store.save(); } }
function remember(a) {
  if (!a?.id) return;
  META.set(a.id, merge(META.get(a.id), a));
  const s = D().anime[a.id];
  if (s && (!s.image || !s.genres) && a.image) { upsertAnime(a); Store.save(); }
}
const getA = id => META.get(+id) || D().anime[+id];
const st = id => D().status[id] || {};
function setSt(id, patch) { D().status[id] = { ...st(id), ...patch }; Store.save(); }
const inWL = id => D().watchlist.some(w => w.id === +id);
function removeWL(id) { D().watchlist = D().watchlist.filter(w => w.id !== +id); }
function toggleWL(id) {
  if (inWL(id)) { removeWL(id); toast('Removed from watchlist'); }
  else { D().watchlist.push({ id: +id, added: Date.now() }); toast('Added to watchlist'); }
  Store.save();
}
/* ---------- watching (started, not finished) + watchlist priority ---------- */
const watchingOf = id => D().watching.find(w => w.id === +id);
const isWatching = id => !!watchingOf(id);
function startWatching(id) { if (!watchingOf(id)) D().watching.push({ id: +id, started: Date.now(), ep: 0, updated: Date.now() }); removeWL(id); Store.save(); }
function stopWatching(id) { D().watching = D().watching.filter(w => w.id !== +id); Store.save(); }
function toggleWatching(id) { if (isWatching(id)) { stopWatching(id); toast('Removed from Watching'); } else { startWatching(id); toast('Added to Watching'); } }
function setEp(id, ep) {
  const w = watchingOf(id); if (!w) return;
  const a = getA(id), max = a?.episodes || 99999, was = w.ep || 0;
  w.ep = Math.max(0, Math.min(max, ep)); w.updated = Date.now(); Store.save();
  if (a?.episodes && w.ep >= a.episodes && was < a.episodes) offerFinish(id);
}
function offerFinish(id) {

const AL_REC = 'query($id:Int){Media(idMal:$id,type:ANIME){recommendations(sort:RATING_DESC,perPage:12){nodes{mediaRecommendation{idMal title{romaji english} coverImage{extraLarge large}}}}}}';

const AL_STATUS = { FINISHED: 'Finished Airing', RELEASING: 'Currently Airing', NOT_YET_RELEASED: 'Not yet aired', CANCELLED: 'Cancelled', HIATUS: 'On hiatus' };

let routeId = 0, refreshFn = null;
function parseHash() {
  const h = location.hash.slice(1) || '/'; const [p, qs = ''] = h.split('?');
  return { parts: p.split('/').filter(Boolean), params: Object.fromEntries(new URLSearchParams(qs)) };
}
async function route(keep) {
  routeId++; refreshFn = null;
  const y = scrollY, { parts, params } = parseHash(), r = parts[0] || 'home';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  const lib = ['watched', 'watching', 'diary', 'watchlist', 'lists', 'list'].includes(r);
  document.querySelectorAll('#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.r === r || (lib && a.dataset.r === 'library') || (r === 'friend' && a.dataset.r === 'friends')));
  document.body.classList.toggle('inlib', lib);
  document.querySelectorAll('#libnav a').forEach(a => a.classList.toggle('on', a.dataset.r === r || (r === 'list' && a.dataset.r === 'lists')));
  document.getElementById('meBtn').classList.toggle('on', r === 'profile');
  document.querySelector('.top').classList.remove('searching');
  updateBack(r);
  const backTo = NAV.back;
  if (!keep) scrollTo(0, 0);
  if (r !== 'search') document.getElementById('q').value = '';
  V.classList.remove('hidew'); hoverTile = null;
  try {
    switch (r) {
      case 'discover': viewDiscover(); break;
      case 'search': await viewSearch(params.q || ''); break;
      case 'anime': await viewAnime(parts[1]); break;
      case 'diary': viewDiary(params); break;
      case 'watched': viewWatched(params); break;
      case 'watching': viewWatching(); break;
      case 'watchlist': viewWatchlist(params); break;
      case 'lists': viewLists(); break;
      case 'list': viewList(parts[1]); break;
      case 'profile': viewProfile(parts[1]); break;
      case 'friends': viewFriends(); break;
      case 'friend': viewFriend(parts.slice(1).join('/')); break;   // friend codes are "user/gist"
      default: await viewHome();
    }
  } catch (e) { console.error(e); V.innerHTML = errBox(e); }
  if (keep) scrollTo(0, y);
  else if (backTo) { NAV.back = backTo; restoreScroll(); }
}
function refresh() { if (refreshFn) refreshFn(); else route(true); }

    if (!tr || s.loading || !s.next || my !== routeId) return;
    s.loading = true; s.ok = false;
    try {
      const j = await jikan(`${r.path}${r.path.includes('?') ? '&' : '?'}page=${s.page + 1}&limit=25`);
      if (my !== routeId) return;
      s.page++; s.next = !!j.pagination?.has_next_page && s.page < 40;
      const list = uniq((j.data || []).map(normalize)).filter(a => a.id && !s.seen.has(a.id));
      list.forEach(a => { s.seen.add(a.id); remember(a); });
      DISC[r.key].ids.push(...list.map(a => a.id)); DISC[r.key].page = s.page;
      if (s.page === 1) tr.innerHTML = '';
      tr.insertAdjacentHTML('beforeend', list.map(a => dtile(a, r.ranked ? ++s.n : 0)).join(''));
      [...tr.children].slice(-list.length).forEach(t => t.classList.contains('dtile') && syncTile(t));
      s.ok = true;
    } catch (e) {
      if (my !== routeId) return;
      if (s.page === 0) tr.innerHTML = errBox(e); else toast('Couldn’t load more: ' + e.message, true, 4000);
    } finally { s.loading = false; }
    if (want[r.key] && !s.restored && my === routeId) {
      if (tr.scrollWidth - tr.clientWidth >= want[r.key] || !s.next || s.page >= 12) { tr.style.scrollBehavior = 'auto'; tr.scrollLeft = want[r.key]; s.restored = true; }
      else return more(r);
    }
    fillCheck(r);
  }
  ROWS.forEach(r => {
    state[r.key] = { page: 0, next: true, loading: false, ok: false, n: 0, seen: new Set() };
    DISC[r.key] = { title: r.title, path: r.path, page: 0, ids: [] };
    const tr = document.getElementById('ct-' + r.key);
    tr.addEventListener('scroll', () => fillCheck(r), { passive: true });
    more(r);
  });
  V.querySelectorAll('.cbtn').forEach(b => b.onclick = () => {
    const tr = document.getElementById('ct-' + b.dataset.row);
    tr.scrollBy({ left: +b.dataset.dir * tr.clientWidth * 0.85, behavior: 'smooth' });
  });
}

let drag = null;

document.addEventListener('pointermove', ev => {

// In the app, files go to the exports folder and Explorer opens on them; otherwise they download.
async function saveFiles(files, zipName) {
  if (Store.mode === 'server') {
    try {
      const r = await fetch('/api/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: zipName || '', zip: !!zipName, files }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      toast('Saved to ' + j.path, false, 5000); return;
    } catch (e) { toast('Couldn’t save the export: ' + e.message, true, 5000); return; }
  }
  // phone / browser: one file (several get zipped), then the share sheet (Save to Files, AirDrop…) or a download
  const blob = zipName ? zipStore(files) : new Blob([files[0].content], { type: files[0].name.endsWith('.json') ? 'application/json' : 'text/csv;charset=utf-8' });
  const name = zipName ? zipName + '.zip' : files[0].name.split('/').pop();
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);

async function openScanner() {

  const stop = () => { stopped = true; cancelAnimationFrame(raf); stream?.getTracks().forEach(t => t.stop()); };

    await loadScript('jsqr.js');

function makeSource(kind, type, opts = {}) {
  const t = type ? `type=${type}` : '';

    return src;

  liked: ['liked', 'like', 'favorite', 'favourite', 'aimé', 'aime', 'coup de cœur', 'coup de coeur', 'favori'], rewatch: ['rewatch', 'rewatched', 'revu', 'revisionnage'], review: ['review', 'comment', 'notes', 'my_comments', 'critique', 'avis', 'commentaire'], spoiler: ['spoiler', 'spoilers', 'contains spoilers', 'divulgâcheur'],
  status: ['status', 'my_status', 'list', 'statut', 'état', 'etat'], pos: ['position', 'rank', '#', 'rang'],
  ep: ['episode', 'progress', 'episodes watched', 'my_watched_episodes', 'épisode', 'episode actuel', 'ep'], prio: ['priority', 'priorité', 'priorite', 'prio', 'my_priority'],
};
const col = (r, k) => { for (const c of COLS[k]) if (r[c] != null && r[c] !== '') return r[c]; return ''; };
const truthy = v => /^(yes|y|true|1|x|✓|oui|liked|♥)$/i.test(String(v).trim());
function parseDateAny(v) {
  v = String(v || '').trim(); if (!v) return '';
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v); if (m && +m[1] > 1900 && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/.exec(v);
  if (m) { let dd = +m[1], mm = +m[2]; if (mm > 12 && dd <= 12) [dd, mm] = [mm, dd]; if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return `${m[3]}-${pad(mm)}-${pad(dd)}`; }
  const t = Date.parse(v); return isNaN(t) ? '' : tsDate(t);
}
function guessKind(name, head) {
  const n = name.toLowerCase();
  if (/watchlist|plan.?to.?watch/.test(n)) return 'watchlist';
  if (/watching|en.?cours|in.?progress/.test(n)) return 'watching';
  if (/diary|review/.test(n)) return 'diary';
  if (/like/.test(n)) return 'likes';
  if (/rating|watched|completed/.test(n)) return 'watched';
  if (/profile/.test(n)) return 'skip';
  if (/(^|\/)lists?\//.test(n) || /^list/.test(n.split('/').pop())) return 'list';
  if (COLS.wdate.some(c => head.includes(c)) && !COLS.status.some(c => head.includes(c))) return 'diary';
  if (COLS.status.some(c => head.includes(c))) return 'auto';
  return 'watched';
}
const KIND_LABELS = [['diary', 'Diary entries'], ['watched', 'Watched'], ['likes', 'Likes (watched + ♥)'], ['watchlist', 'Watchlist'], ['watching', 'Watching (started)'], ['list', 'A custom list'], ['auto', 'Use each row’s Status column'], ['skip', 'Skip this file']];
const normT = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9぀-ヿ一-鿿]+/g, '');

async function matchTitle(name, year) {
  const q = name.replace(/\s+/g, ' ').trim().slice(0, 90); if (q.length < 2) return null;
  let j; try { j = await jikan(`/anime?q=${encodeURIComponent(q)}&limit=10&order_by=members&sort=desc`); } catch (e) { return { failed: e.message }; }
  const cands = uniq((j.data || []).map(raw => { const a = normalize(raw); if (a) a.syns = (raw.titles || []).map(t => t.title).concat(raw.title_synonyms || []); return a; }));
  if (!cands.length) return null;
  const nq = normT(q); let best = null, bestS = 0;
  cands.forEach((a, i) => {
    const names = [a.title, a.romaji, a.jp, ...(a.syns || [])].map(normT).filter(Boolean);
    let sc = names.includes(nq) ? 6 : names.some(x => x.startsWith(nq) || nq.startsWith(x)) ? 2 : names.some(x => x.includes(nq)) ? 1 : 0;
    if (sc && year && a.year) sc += +year === a.year ? 3 : Math.abs(+year - a.year) === 1 ? 1 : -2;
    sc -= i * 0.05;
    if (sc > bestS) { bestS = sc; best = a; }
  });
  if (best) delete best.syns;
  return bestS >= 1 ? best : null;
}

async function runImport(files, ui) {
  const d = D(), res = { watched: 0, diary: 0, watchlist: 0, likes: 0, lists: 0, skipped: 0, unmatched: [] };
  const rows = [];
  for (const f of files) {
    if (f.kind === 'skip') continue;
    const listObj = f.kind === 'list' ? { id: uid(), name: (f.name.split('/').pop().replace(/\.csv$/i, '').replace(/^list[-_ ]?/i, '') || 'Imported list'), desc: '', ranked: f.parsed.head.some(h => COLS.pos.includes(h)), items: [], created: Date.now(), updated: Date.now() } : null;
    if (listObj) { const ds = f.parsed.rows.map(r => r.description).find(Boolean); if (ds) listObj.desc = ds; }
    const max10 = f.parsed.rows.some(r => (parseFloat(String(col(r, 'rating')).replace(',', '.')) || 0) > 5);
    f.parsed.rows.forEach((r, i) => rows.push({ r, kind: f.kind, list: listObj, i, fileMax10: max10 }));
    if (listObj) f.listObj = listObj;
  }
  // 1. work out which anime each row is
  const cache = new Map(); let done = 0;
  const need = rows.filter(x => !(+col(x.r, 'id') > 0) && !/myanimelist\.net\/anime\/(\d+)/.test(col(x.r, 'uri')));
  const keys = [...new Set(need.map(x => normT(col(x.r, 'name') || col(x.r, 'alt')) + '|' + col(x.r, 'year')))].filter(k => k[0] !== '|');
  ui(`Matching ${keys.length} title${keys.length === 1 ? '' : 's'} to MyAnimeList…`, 0);
  for (const x of need) {
    const name = col(x.r, 'name') || col(x.r, 'alt'), key = normT(name) + '|' + col(x.r, 'year');
    if (!normT(name) || cache.has(key)) continue;
    let a = await matchTitle(name, col(x.r, 'year'));
    if ((!a || a.failed) && col(x.r, 'alt') && col(x.r, 'alt') !== name) { const b = await matchTitle(col(x.r, 'alt'), col(x.r, 'year')); if (b && !b.failed) a = b; }
    if (a?.failed) { res.searchFailed = a.failed; a = null; }
    cache.set(key, a); done++; ui(`Matching titles to MyAnimeList… ${done} / ${keys.length}`, done / Math.max(1, keys.length));
  }
  // 2. apply
  for (const x of rows) {
    const r = x.r; let id = +col(r, 'id') || +((/myanimelist\.net\/anime\/(\d+)/.exec(col(r, 'uri')) || [])[1] || 0), a = null;
    const name = col(r, 'name') || col(r, 'alt');
    if (!id) { a = cache.get(normT(name) + '|' + col(r, 'year')); id = a?.id || 0; }
    if (!id) { res.unmatched.push(name || `(row ${x.i + 2})`); continue; }
    if (a) upsertAnime(a); else if (!d.anime[id]) d.anime[id] = { id, title: name || `#${id}`, romaji: col(r, 'alt') || name || '', year: +col(r, 'year') || null };
    let rating = 0; const r10 = col(r, 'rating10'), r5 = col(r, 'rating');
    if (r10) rating = Math.round(parseFloat(r10.replace(',', '.')) || 0);
    else if (r5) { const v = parseFloat(r5.replace(',', '.')) || 0; rating = x.fileMax10 || v > 5 ? Math.round(v) : Math.round(v * 2); }
    rating = Math.max(0, Math.min(10, rating));
    const wdate = parseDateAny(col(r, 'wdate')) || parseDateAny(col(r, 'date')), liked = truthy(col(r, 'liked'));
    let kind = x.kind;
    if (kind === 'auto') { const s = col(r, 'status').toLowerCase(); kind = /plan|watchlist|want|à voir|a voir|envie/.test(s) ? 'watchlist' : /watching|en cours|regarde|in progress/.test(s) ? 'watching' : /complete|watched|finished|vu|terminé|termine|fini/.test(s) ? (wdate ? 'diary' : 'watched') : 'skip'; }
    if (kind === 'skip') { res.skipped++; continue; }
    if (kind === 'list') { if (!x.list.items.includes(id)) x.list.items.push(id); continue; }
    const pv = String(col(r, 'prio')).toLowerCase().trim();
    const prio = /^(3|high|haute|must|élevée|elevee|urgent|!!!)/.test(pv) ? 3 : /^(1|low|basse|faible|someday|plus tard|!)$/.test(pv) || /^(low|basse|someday)/.test(pv) ? 1 : pv ? 2 : 0;
    if (kind === 'watchlist') {
      if (!st(id).watched && !inWL(id) && !isWatching(id)) { d.watchlist.push({ id, added: wdate ? Date.parse(wdate + 'T12:00:00') : Date.now(), ...(prio ? { prio } : {}) }); res.watchlist++; }
      else if (inWL(id) && prio) { wlItem(id).prio = prio; res.skipped++; } else res.skipped++;
      continue;
    }
    if (kind === 'watching') {
      const ep = parseInt(col(r, 'ep')) || 0, w = watchingOf(id);
      if (w) { if (ep > (w.ep || 0)) w.ep = ep; res.skipped++; }
      else { d.watching.push({ id, started: wdate ? Date.parse(wdate + 'T12:00:00') : Date.now(), ep, updated: Date.now() }); removeWL(id); res.watching = (res.watching || 0) + 1; }
      continue;
    }
    const s = st(id), wasWatched = s.watched;
    d.status[id] = { ...s, watched: true, ts: s.ts || (wdate ? Date.parse(wdate + 'T12:00:00') : Date.now()), rating: s.rating || rating, liked: !!s.liked || liked || kind === 'likes' };
    removeWL(id);
    if (kind === 'diary' && wdate) {
      const review = col(r, 'review');
      if (!d.entries.some(e => e.animeId === id && e.date === wdate && (e.review || '') === review)) {
        d.entries.push({ id: uid(), animeId: id, date: wdate, rating, liked, review, rewatch: truthy(col(r, 'rewatch')), spoiler: truthy(col(r, 'spoiler')), created: Date.now(), source: 'csv' }); res.diary++;
      }
    }
    if (kind === 'likes') res.likes++;
    if (!wasWatched) res.watched++;
    if (isWatching(id) && kind !== 'likes') d.watching = d.watching.filter(w => w.id !== id);
  }
  files.forEach(f => { if (f.listObj?.items.length) { d.lists.push(f.listObj); res.lists++; } });
  Store.save();
  return res;
}

const ACTIONS = {

    ensure(a); const on = !st(id).watched;
    setSt(id, on ? { watched: true, ts: Date.now() } : { watched: false, rating: 0, liked: false });

  },
  wa(id, a) { ensure(a); toggleWatching(id); },

const placeOf = h => PLACE[(h.replace(/^#\/?/, '').split(/[/?]/)[0]) || 'home'] || 'Back';
function onHashChange() {
  const h = location.hash || '#/', st = NAV.stack, top = st[st.length - 1];
  if (top) {   // remember where we were on the page we're leaving
    top.y = scrollY;

  document.querySelector('.top').classList.toggle('hasback', show);
}
function restoreScroll() {
  const e = NAV.back; NAV.back = null; if (!e || !e.y) return;
  const t0 = Date.now(), go = () => {   // pages fill in as data arrives — keep trying for a moment
    if (document.documentElement.scrollHeight - innerHeight >= e.y - 4 || Date.now() - t0 > 2500) { scrollTo(0, e.y); return; }
    setTimeout(go, 80);
  };
  go();
}
window.addEventListener('hashchange', onHashChange);
document.addEventListener('keydown', ev => { if (ev.altKey && ev.key === 'ArrowLeft' && !SP) { ev.preventDefault(); goBack(); } });
window.addEventListener('mouseup', ev => { if (ev.button === 3 && !SP) { ev.preventDefault(); goBack(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (Store.timer) Store.flush(); if (syncOn() && SYNC.timer) { clearTimeout(SYNC.timer); syncNow(); } }
  else if (syncOn()) syncNow();
});
window.addEventListener('pagehide', () => { if (Store.timer) Store.flush(); });
window.addEventListener('beforeunload', () => {
  if (!Store.timer) return;
  clearTimeout(Store.timer); const body = JSON.stringify(Store.data);
  try { localStorage.setItem('kansho', body); } catch (e) {}
  if (Store.mode === 'server') navigator.sendBeacon('/api/data', new Blob([body], { type: 'application/json' }));
});

(async () => {
  await Store.load(); fixData();
  if (Store.mode === 'server') { try { APP = Object.assign(APP, await (await fetch('/api/info')).json()); } catch (e) {} }
  if (!viaServer() && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
    navigator.storage?.persist?.().catch(() => {});
  }
  const linking = handleLinkHash();
  await route();
  syncBadge();
  if (syncOn()) syncNow();
  setInterval(() => { if (document.visibilityState === 'visible' && syncOn()) syncNow(); }, 45000);
  if (D().share.enabled) setTimeout(() => publishNow(), 4000);
  if (!viaServer() && !syncOn() && !linking && !Object.keys(D().status).length && !D().sync.welcomed) setTimeout(openWelcome, 600);
  if (missing()) setTimeout(backfill, 1500);
})();
